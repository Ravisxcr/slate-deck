[project]
site_name = "typeset"
site_description = "An opinionated Typst presentation package: strict grid, one accent color, and a small set of slide kinds and components."
docs_dir = "docs"

# GitHub Pages serves this project at https://<owner>.github.io/<repo>/ (or a custom domain).
# Instant navigation relies on the generated sitemap.xml, which is empty without this set.
site_url = "https://ravisxcr.github.io/slate-deck/"

nav = [
  {"Home" = "index.md"},
  {"Getting started" = "getting-started.md"},
  {"Design tokens" = "design-tokens.md"},
  {"Slides" = "slides.md"},
  {"Components" = "components.md"},
  {"Diagram" = "diagram.md"},
  {"Icons & fonts" = "icons-and-fonts.md"},
]

[project.theme]
features = [
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.tracking",
  "navigation.top",
  "content.code.copy",
]
